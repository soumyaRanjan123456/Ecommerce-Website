spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        - id: product-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/products/**

        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/orders/**

        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/payments/**

jwt:
  secret: ${JWT_SECRET:my-local-development-secret-key-123456789012}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG